<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página no encontrada · Cooperativa Multiplicador</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0B3A22,#08431F 55%,#005900);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.caja{max-width:560px}.ante{color:#F8DC00;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{margin:.35em 0;font-size:clamp(32px,6vw,52px);line-height:1.1}p{margin:0;font-size:18px;line-height:1.6;opacity:.86}
a{display:inline-block;margin-top:26px;padding:14px 28px;border-radius:999px;background:#F8DC00;color:#0B3A22;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="caja">
<div class="ante">Error 404</div>
<h1>No encontramos esta página</h1>
<p>Es posible que la dirección haya cambiado. Vuelve al inicio para encontrar lo que buscas.</p>
<a id="inicio" href="/">Ir al inicio</a>
</div>
<script>
(function () {
	var enlace = document.getElementById('inicio');
	var partes = location.pathname.split('/').filter(Boolean);
	if (/\.github\.io$/i.test(location.hostname) && partes.length) {
		var raiz = '/' + partes[0] + '/';
		enlace.href = raiz;
		fetch(raiz, { method: 'HEAD' }).then(function (r) { if (!r.ok) { enlace.href = '/'; } }).catch(function () {});
	}
}());
</script>
</body>
</html>
